[alias]
# There is one package: Studio picks Community or Professional features at
# runtime from the licence. These aliases build the workspace into the shared
# `target/studio` directory the packager uses. `cargo xtask build-all` /
# `check-all` run them with the Professional features added when this checkout
# has the private sources (Windows only, since ASIO is Windows-only).
build-studio = [
    "build",
    "--workspace",
    "--target-dir",
    "target/studio",
]
check-studio = [
    "check",
    "--workspace",
    "--target-dir",
    "target/studio",
]

# Quality gates (CI uses these).
clippy-studio = [
    "clippy",
    "--workspace",
    "--target-dir",
    "target/studio",
]
test-studio = [
    "test",
    "--workspace",
    "--target-dir",
    "target/studio",
]

xtask = ["run", "--package", "xtask", "--"]

# WhiteSharp VST3/CLAP is a separate workspace. Same arguments as `cargo xtask`
# inside `vstplugins/whitesharp_vst3`:
#   cargo whitesharp-vst3 bundle whitesharp_vst3 --release
whitesharp-vst3 = [
    "run",
    "--manifest-path",
    "vstplugins/whitesharp_vst3/Cargo.toml",
    "--package",
    "xtask",
    "--release",
    "--",
]

# Rodhareist VST2/VST3/CLAP, the same way:
#   cargo rodhareist-vst3 bundle rodhareist_vst3 --release
rodhareist-vst3 = [
    "run",
    "--manifest-path",
    "vstplugins/rodhareist_vst3/Cargo.toml",
    "--package",
    "xtask",
    "--release",
    "--",
]

# Binary packaging / staging into `out/` (see xtask/README.md). These build the
# app and stage a clean runnable tree separate from the Cargo `target/` cache.
#   cargo package-dev       → out/dev/<platform>
#   cargo package-release   → out/release/<platform>
# The host target triple is used by default; pass `--target <triple>` to cross
# the mapping to another platform folder.
package-dev = [
    "run",
    "--package",
    "xtask",
    "--",
    "package",
    "--profile",
    "dev",
]
package-release = [
    "run",
    "--package",
    "xtask",
    "--",
    "package",
    "--profile",
    "release",
    "--plugin",
    "all",
]

# Do not set CEF_PATH or LIBCLANG_PATH globally here. Cargo has no target-scoped
# [env] support, so a platform-specific default contaminates builds for every
# other host and cross-compilation target. CI and developer shells must export
# paths that match Cargo's TARGET before invoking Cargo.

# The vendored ARA bridge needs no entry here either: its C++ shim resolves
# `external/ARA_SDK` and `external/vst3sdk` from the repository root in
# `crates/Ara2Bridge/ara2-bridge-companion/build.rs`, with `ARA_SDK_DIR` /
# `ARA_VST3_SDK_DIR` left as opt-in overrides for out-of-tree SDK experiments.

# The 32-bit plug-in bridge (`FutureboardPluginHostX86.exe` and its scanner)
# is the only thing built for this target. It links the C runtime statically
# so it runs on machines without the 32-bit Visual C++ runtime installed,
# which a 64-bit Studio install does not bring.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
