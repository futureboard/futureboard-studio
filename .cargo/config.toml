[alias]
# Build the full workspace as Community Edition.
build-ce = [
    "build",
    "--workspace",
    "--target-dir",
    "target/community",
]

# Build the Windows Professional Edition with ASIO.
build-professional-win = [
    "build",
    "--workspace",
    "--features",
    "futureboard_native/professional,sphere_directaudioengine/asio",
    "--target-dir",
    "target/professional",
]

# Check Community Edition in its isolated target directory.
check-ce = [
    "check",
    "--workspace",
    "--target-dir",
    "target/community",
]

# Check Windows Professional Edition in its isolated target directory.
check-professional-win = [
    "check",
    "--workspace",
    "--features",
    "futureboard_native/professional,sphere_directaudioengine/asio",
    "--target-dir",
    "target/professional",
]

# Community Edition quality gates (CI uses these).
clippy-ce = [
    "clippy",
    "--workspace",
    "--target-dir",
    "target/community",
]
test-ce = [
    "test",
    "--workspace",
    "--target-dir",
    "target/community",
]

# Cargo unifies features within one build graph, so each edition must use
# a separate target directory to avoid overwriting or reusing app artifacts.
# Aliases cannot chain commands, so cross-edition combos live in the xtask:
#   cargo xtask build-all [--release]   → build-ce, then Professional on Windows
#   cargo xtask check-all               → check-ce, then Professional on Windows
#   cargo xtask build-all --target x86_64-pc-windows-msvc → include Windows
xtask = ["run", "--package", "xtask", "--"]

# WhiteSharp VST3/CLAP is a separate workspace. Same arguments as `cargo xtask`
# inside `vstplugins/whitesharp_vst3`:
#   cargo whitesharp-vst3 bundle whitesharp_vst3 --release
whitesharp-vst3 = [
    "run",
    "--manifest-path",
    "vstplugins/whitesharp_vst3/Cargo.toml",
    "--package",
    "xtask",
    "--release",
    "--",
]

# Binary packaging / staging into `out/` (see xtask/README.md). These build the
# app and stage a clean runnable tree separate from the Cargo `target/` cache.
#   cargo package-dev         → out/dev/<platform>
#   cargo package-ce          → out/release/community/<platform>
#   cargo package-professional   → out/release/professional/<platform>
# The host target triple is used by default; pass `--target <triple>` to cross
# the mapping to another platform folder.
package-dev = [
    "run",
    "--package",
    "xtask",
    "--",
    "package",
    "--profile",
    "dev",
    "--edition",
    "community",
]
package-ce = [
    "run",
    "--package",
    "xtask",
    "--",
    "package",
    "--profile",
    "release",
    "--edition",
    "community",
]
package-professional = [
    "run",
    "--package",
    "xtask",
    "--",
    "package",
    "--profile",
    "release",
    "--edition",
    "professional",
]

# Do not set CEF_PATH or LIBCLANG_PATH globally here. Cargo has no target-scoped
# [env] support, so a platform-specific default contaminates builds for every
# other host and cross-compilation target. CI and developer shells must export
# paths that match Cargo's TARGET before invoking Cargo.

# The vendored ARA bridge needs no entry here either: its C++ shim resolves
# `external/ARA_SDK` and `external/vst3sdk` from the repository root in
# `crates/Ara2Bridge/ara2-bridge-companion/build.rs`, with `ARA_SDK_DIR` /
# `ARA_VST3_SDK_DIR` left as opt-in overrides for out-of-tree SDK experiments.
