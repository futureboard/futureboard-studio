[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Futureboard workspace task runner — cross-edition build chaining and binary packaging/staging"
license.workspace = true
publish = false
# Stages the Professional Edition build toolchain from the private checkout when
# one is present (see build.rs and src/toolchain.rs).
build = "build.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sphere-webview.workspace = true
# Parse `cargo build --message-format=json` artifact messages to discover the
# real executable path instead of guessing target/<profile>/FutureboardNative.
cargo_metadata = "0.18"
# Used by the Professional Edition build toolchain that `build.rs` stages from
# the private checkout (`src/toolchain.rs`). Declared unconditionally so the
# public manifest stays valid and identical whether or not that checkout exists.
ureq.workspace = true
zip.workspace = true

# Reads available physical memory to cap Cargo parallelism (src/jobs.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
