[package]
name = "livestage"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "LiveStage: a live mixer and effects rack, as a desktop app or a headless server."

# The desktop mixer.
[[bin]]
name = "LiveStage"
path = "src/main.rs"
required-features = ["gui"]

# The same engine without a window: a session file, the interface, and JSON
# commands on stdin. On a Linux box with no desktop, build it with
# `--no-default-features` — ALSA and the built-in effects only.
[[bin]]
name = "livestage-server"
path = "src/server.rs"

# The appliance's console (tty1): the first-boot setup and a status screen,
# and `--boot`, which writes the network, name and time zone into /run. Built
# for the appliance image only.
[[bin]]
name = "livestage-setup"
path = "src/console/main.rs"
required-features = ["appliance"]

# The installer USB stick's text UI (tty1): puts the appliance image onto a
# computer's disk, with the setup's answers if given there. Built for the
# installer image only (packaging/livestage, -Installer).
[[bin]]
name = "livestage-installer"
path = "src/installer/main.rs"
required-features = ["appliance"]

[features]
default = ["gui", "external-plugins"]
gui = [
    "dep:gpui",
    "dep:sphere_ui_components",
    "dep:raw-window-handle",
    "dep:gpui_windows",
    "dep:gpui_linux",
]
external-plugins = ["livestage-engine/external-plugins"]
appliance = ["dep:ratatui", "dep:sha1"]
# Developer tool: `LiveStage --preview DIR` renders each view of a demo
# session to PNG off-screen and quits. Never in a release.
ui-preview = ["gui", "sphere_ui_components/ui-preview", "gpui/test-support", "dep:fa76"]

[dependencies]
livestage-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
# The server's web UI: the page's embedded assets, and a blocking WebSocket
# (plain ws on the local network; no TLS, no async runtime).
builtin-ui-embed.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The appliance console's text UI (crossterm draws on the Linux console).
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"], optional = true }
# The console's Wi-Fi setup keeps only the WPA key made from the password
# (PBKDF2-HMAC-SHA1, as wpa_passphrase), never the password; the server keeps
# web users' PINs only as PBKDF2-HMAC-SHA256 hashes.
pbkdf2.workspace = true
sha1 = { version = "0.10", optional = true }
sha2.workspace = true
# The PIN hashes' salts and the log-in tokens, from the operating system's
# random source.
rand.workspace = true
# The server's MIDI remote: control surfaces in and feedback out (WinMM on
# Windows, the ALSA sequencer on Linux).
midir.workspace = true
# The preview demo addresses FA-76 parameters by name.
fa76 = { workspace = true, optional = true }

gpui = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
sphere_ui_components = { workspace = true, optional = true, features = [
    "gpu-renderer",
    "builtin-plugin-editor",
] }

[build-dependencies]
builtin-ui-embed = { workspace = true, features = ["generate"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { workspace = true, optional = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { workspace = true, optional = true, features = ["wayland", "x11"] }
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[lints]
workspace = true
