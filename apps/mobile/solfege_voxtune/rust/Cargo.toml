[package]
name = "canto_dsp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Solfege Voxtune for Android: FFI, AAudio output and recorder around the sphere_voxtune engine"

# Standalone crate (built per Android ABI and copied into jniLibs); keep it out
# of the Futureboard root workspace.
[workspace]

[lib]
name = "canto_dsp"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# The engine, shared with the desktop app, Studio and the plug-in.
sphere_voxtune = { path = "../../../../crates/SphereVoxtune" }
serde_json = "1.0"
