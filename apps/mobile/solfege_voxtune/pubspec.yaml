name: solfege_voxtune
description: "CANTO — Mobile vocal pitch editor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^4.0.1
  google_fonts: ^9.0.0
  ffi: ^2.2.0
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: MonaSans
      fonts:
        - asset: assets/fonts/MonaSansVF.ttf
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    # Thai glyphs only (subset of Google Sans, wght 400-700); used as the
    # fallback behind Mona Sans and Barlow.
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Thai.ttf
