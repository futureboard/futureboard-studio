
[workspace]
resolver = "3"

members = [
    "apps/native/studio",
    "apps/native/cef_helper",
    "apps/native/livestage",
    "apps/native/singer",
    "apps/native/jamsession",

    "crates/SphereAudioEditor",
    "crates/SphereAudioPlugins",
    "crates/SphereDirectAudioEngine",
    "crates/SphereEncoder",
    "crates/SphereGraphicEngine",
    "crates/SphereNotationEngine",
    "crates/SpherePluginHost",
    "crates/SphereSoundfontPlayer",
    "crates/SphereUIComponents",
    "crates/SphereVideoPlayer",
    "crates/SphereWebAudioCore",
    "crates/SpherePackageInstaller",
    "apps/native/apakinstaller",
    "crates/SphereAudioProcessor",
    "crates/SphereStemExtractor",
    "crates/SphereMidiService",
    "crates/SphereDiscordRPC",
    "crates/SpherePlatform",
    "crates/SphereWebView",
    "crates/SphereJamClient",
    "crates/SphereAraHost",

    # Vendored ARA 2 bindings, trimmed to the host-side crates Futureboard uses.
    # See `crates/Ara2Bridge/VENDORING.md` for provenance and local changes.
    "crates/Ara2Bridge/ara2-bridge-sys",
    "crates/Ara2Bridge/ara2-bridge-core",
    "crates/Ara2Bridge/ara2-bridge-host",
    "crates/Ara2Bridge/ara2-bridge-companion",
    "crates/BuiltinAudioPlugins",
    # Builtin stock DSP cores (engine integration deferred).
    "crates/BuiltinAudioPlugins/crates/builtin_dsp_core",
    "crates/BuiltinAudioPlugins/crates/builtin_ui_embed",
    "crates/BuiltinAudioPlugins/crates/equz8",
    "crates/BuiltinAudioPlugins/crates/equzx",
    "crates/BuiltinAudioPlugins/crates/compresser",
    "crates/BuiltinAudioPlugins/crates/fa2a",
    "crates/BuiltinAudioPlugins/crates/echospace",
    "crates/BuiltinAudioPlugins/crates/fa76",
    "crates/BuiltinAudioPlugins/crates/burnLimit",
    "crates/BuiltinAudioPlugins/crates/67Clipper",
    "crates/BuiltinAudioPlugins/crates/Transient",
    "crates/BuiltinAudioPlugins/crates/c1073",
    "crates/BuiltinAudioPlugins/crates/meowsyn",
    "crates/BuiltinAudioPlugins/crates/wrapsynth",
    "crates/BuiltinAudioPlugins/crates/zcomp",
    "crates/BuiltinAudioPlugins/crates/mixstation",
    "crates/BuiltinAudioPlugins/crates/rodharerist",
    "crates/BuiltinAudioPlugins/crates/verbspace",
    "xtask"
]

exclude = [
    # Vendored GPUI is a nested workspace. It is consumed as path dependencies,
    # but must not be claimed as a member of the Futureboard root workspace.
    "crates/gpui",

    # JS/Rust extension templates — built independently.
    "extensions",
    "extensions/template",
    "extensions/template-react",
    "extensions/template-vue",

    # Experimental / placeholder crates. Promote only when implementation is real.
    "crates/SphereExtensionHost",
    "crates/SphereMediaUtils",
    "crates/SphereNoiseRemover",
    "crates/SphereSettings",
    "crates/SphereVoiceTune",
]


[workspace.package]
version = "2026.9.8-beta1.2.2"
edition = "2024"
license = "MIT"
publish = false


# =============================================================================
# Futureboard / Sphere workspace crates
# =============================================================================

[workspace.dependencies]
sphere_ui_components = { path = "crates/SphereUIComponents", default-features = false }
sphere_directaudioengine = { path = "crates/SphereDirectAudioEngine", default-features = false }
sphere-audio-processor = { path = "crates/SphereAudioProcessor" }
sphere-stem-extractor = { path = "crates/SphereStemExtractor", package = "SphereFBStemExtractor" }
sphere-audio-editor = { path = "crates/SphereAudioEditor" }
sphere-audio-plugins = { path = "crates/SphereAudioPlugins" }
# MP3 is optional in sphere-encoder (needs libmp3lame via mp3lame-sys). Enable
# it for Studio export so `mp3_available()` is true on Linux/macOS/Windows
# builds that have a C toolchain — which every supported Studio build has.
sphere-encoder = { path = "crates/SphereEncoder", features = ["mp3"] }
sphere-graphic-engine = { path = "crates/SphereGraphicEngine" }
sphere-midi-service = { path = "crates/SphereMidiService", package = "SphereMidiService" }
sphere-plugin-host = { path = "crates/SpherePluginHost", default-features = false }
sphere-soundfont-player = { path = "crates/SphereSoundfontPlayer", package = "SphereSoundfontPlayer" }
# Video preview/reference decoding for the arrangement Video Track. Uses OS
# codecs (Media Foundation on Windows) — no FFmpeg/libav anywhere.
sphere-video-player = { path = "crates/SphereVideoPlayer" }
sphere-discord-rpc = { path = "crates/SphereDiscordRPC", package = "SphereDiscordRPC" }
sphere-platform = { path = "crates/SpherePlatform", package = "SpherePlatform" }
sphere-webview = { path = "crates/SphereWebView", package = "SphereWebView" }
# Futureboard Audio Jam client: control plane (REST + signaling), media plane
# (UDP/TCP/TLS), session clock and jitter buffering. Network only — it owns no
# audio device and no GPUI state.
sphere-jam-client = { path = "crates/SphereJamClient", package = "sphere-jam-client" }
# ARA 2 host runtime. Real implementation on Windows/macOS, stub elsewhere.
sphere-ara-host = { path = "crates/SphereAraHost", package = "SphereAraHost" }

# Vendored ARA 2 SDK bindings (from futureboard/ara2-bridge v0.3.0). Source lives
# in-tree under `crates/Ara2Bridge`; its C++ VST3 shim compiles against the
# `external/ARA_SDK` and `external/vst3sdk` submodules directly.
ara2-bridge-core = { path = "crates/Ara2Bridge/ara2-bridge-core" }
ara2-bridge-host = { path = "crates/Ara2Bridge/ara2-bridge-host" }
ara2-bridge-sys = { path = "crates/Ara2Bridge/ara2-bridge-sys" }
ara2-bridge-companion = { path = "crates/Ara2Bridge/ara2-bridge-companion", default-features = false }

# BuiltinAudioPlugins stock DSP cores (no DirectAudioEngine wiring yet).
builtin-audio-plugins = { path = "crates/BuiltinAudioPlugins", package = "BuiltinAudioPlugins" }
builtin-dsp-core = { path = "crates/BuiltinAudioPlugins/crates/builtin_dsp_core", package = "builtin_dsp_core" }
# Embedded editor-UI assets + build-time generator. Dependency-free by design;
# see the crate docs before adding anything to it.
builtin-ui-embed = { path = "crates/BuiltinAudioPlugins/crates/builtin_ui_embed", package = "builtin_ui_embed" }
equz8 = { path = "crates/BuiltinAudioPlugins/crates/equz8" }
equzx = { path = "crates/BuiltinAudioPlugins/crates/equzx" }
compresser = { path = "crates/BuiltinAudioPlugins/crates/compresser" }
fa2a = { path = "crates/BuiltinAudioPlugins/crates/fa2a" }
echospace = { path = "crates/BuiltinAudioPlugins/crates/echospace" }
fa76 = { path = "crates/BuiltinAudioPlugins/crates/fa76" }
burnlimit = { path = "crates/BuiltinAudioPlugins/crates/burnLimit" }
clipper67 = { path = "crates/BuiltinAudioPlugins/crates/67Clipper" }
transient = { path = "crates/BuiltinAudioPlugins/crates/Transient" }
c1073 = { path = "crates/BuiltinAudioPlugins/crates/c1073" }
meowsyn = { path = "crates/BuiltinAudioPlugins/crates/meowsyn" }
wrapsynth = { path = "crates/BuiltinAudioPlugins/crates/wrapsynth" }
zcomp = { path = "crates/BuiltinAudioPlugins/crates/zcomp" }
mixstation = { path = "crates/BuiltinAudioPlugins/crates/mixstation" }
rodharerist = { path = "crates/BuiltinAudioPlugins/crates/rodharerist" }
verbspace = { path = "crates/BuiltinAudioPlugins/crates/verbspace" }

# MIT/Apache-2.0 DSP libraries used by BuiltinAudioPlugins.
biquad = "0.6"
# Pure-Rust, real-time-safe .nam (Neural Amp Modeler) inference — used by
# rodharerist's NAM Capture tone engine.
nam-rs = "0.3"
# `std` required (fundsp no_std path currently misses Vec imports in resample).
# Keep `files`/`fft` off to avoid pulling Symphonia into stock synth DSP.
fundsp = { version = "0.23", default-features = false, features = ["std"] }

# CEF 150.0.11 bindings have not reached crates.io yet. Keep the exact upstream
# revision that declares workspace version 150.1.0+150.0.11.
cef = { git = "https://github.com/tauri-apps/cef-rs.git", rev = "8c8af8cb5a6b4cce994d5745d031b0196959c22f", default-features = false }
download-cef = "2.3.2"
ureq = "3"


# =============================================================================
# Native UI / GPUI vendored stack
# =============================================================================

gpui = { path = "crates/gpui", version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_linux = { path = "crates/gpui/crates/gpui_linux", default-features = false }
# `default-features = false` keeps the macOS backend from pulling `gpui/default`,
# but it also strips `gpui_macos`'s own `font-kit` feature. Without that feature
# `MacPlatform::new` installs `gpui::NoopTextSystem`, whose `add_fonts` reports
# success and whose font metrics are synthetic: every surface lays out and paints
# normally except the glyphs, so all text is invisible. Enable it explicitly.
gpui_macos = { path = "crates/gpui/crates/gpui_macos", default-features = false, features = [
    "font-kit",
] }
gpui_macros = { path = "crates/gpui/crates/gpui_macros" }
gpui_platform = { path = "crates/gpui/crates/gpui_platform", default-features = false }
gpui_shared_string = { path = "crates/gpui/crates/gpui_shared_string" }
gpui_util = { path = "crates/gpui/crates/gpui_util" }
gpui_web = { path = "crates/gpui/crates/gpui_web" }
gpui_wgpu = { path = "crates/gpui/crates/gpui_wgpu" }
gpui_windows = { path = "crates/gpui/crates/gpui_windows", default-features = false }


# =============================================================================
# Zed / GPUI support crates vendored in this repository
# =============================================================================

collections = { path = "crates/collections", version = "0.1.0" }
derive_refineable = { path = "crates/refineable/derive_refineable" }
http_client = { path = "crates/http_client" }
http_client_tls = { path = "crates/http_client_tls" }
media = { path = "crates/media" }
perf = { path = "tooling/perf" }
refineable = { path = "crates/refineable" }
reqwest_client = { path = "crates/reqwest_client" }
scheduler = { path = "crates/scheduler" }
sum_tree = { path = "crates/sum_tree" }
util = { path = "crates/util" }
util_macros = { path = "crates/util_macros" }
zlog = { path = "crates/zlog" }
ztracing = { path = "crates/ztracing" }
ztracing_macro = { path = "crates/ztracing_macro" }


# =============================================================================
# Audio / MIDI / media
# =============================================================================

base64 = "0.22"
cpal = "0.15"
crc32fast = "1"
crossbeam-channel = "0.5"
heapless = "0.9.2"
memmap2 = "0.9"
midir = "0.9"
rustfft = "6"

# Solfege is consumed from its own Git repository so Singer follows the
# engine's host-neutral runtime and event contracts instead of maintaining a
# fork here — and so a clone builds without a sibling `../dsp` checkout.
solfege-audio = { git = "https://github.com/futureboard/solfage-engine" }
solfege-core = { git = "https://github.com/futureboard/solfage-engine" }
solfege-engine = { git = "https://github.com/futureboard/solfage-engine", default-features = false, features = ["fbmx"] }
solfege-event = { git = "https://github.com/futureboard/solfage-engine" }
# SFM v1 container reader produced by the DSP workspace. This is format-only;
# realtime inference still comes from the existing Solfege + FBMX runtimes.
solfege-model = { git = "https://github.com/futureboard/solfage-engine" }
solfege-acoustic = { git = "https://github.com/futureboard/solfage-engine" }
# Shared FBMX container loader used by the DAW's Solfege instrument wrapper.
fbmx-runtime = { git = "https://github.com/futureboard/fbmx-runtime" }
# Pure-Rust ONNX inference (CPU) for offline audio analysis. Dual MIT/Apache-2.0.
# Re-exports `tract_ndarray` via its prelude.
tract-onnx = "0.21"
# ONNX Runtime bindings for GPU-capable MDX-NET stem inference (CUDA/DirectML/CoreML).
# `load-dynamic` resolves the ONNX Runtime shared library at runtime (from
# `ORT_DYLIB_PATH` or the system path) instead of downloading/linking at build
# time — this keeps the build offline-friendly and lets users drop in a
# GPU-enabled onnxruntime without recompiling. GPU EPs are opt-in per-crate.
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
    "ndarray",
    "load-dynamic",
] }
ndarray = "0.16"
# High-quality sinc resampler to bring input to the MDX-NET 44.1 kHz contract.
rubato = "0.16"
# Archive extraction for the build-time ONNX Runtime download (zip on Windows,
# gzip+tar on Linux/macOS).
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
symphonia = { version = "0.5", default-features = false, features = [
    "wav",
    "pcm",
    "aiff",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "isomp4",
    "aac",
    "alac",
] }


# =============================================================================
# Async / tasks / channels
# =============================================================================

async-channel = "2.5.0"
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-fs = "2.1"
async-tar = "0.5.1"
async-task = "4.7"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
futures = "0.3.32"
futures-concurrency = "7.7.1"
futures-lite = "1.13"
postage = { version = "0.5", features = ["futures-traits"] }
smol = "2.0"
tokio = { version = "1" }


# =============================================================================
# Serialization / data / IDs
# =============================================================================

anyhow = "1.0.86"
bitflags = "2.6.0"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2.7.0", features = ["serde"] }
# Read-only DOM parser for importing other DAWs' XML project files
# (`crates/SphereUIComponents/src/project/import`).
roxmltree = "0.20"
schemars = { version = "1.0", features = ["indexmap2"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
serde_urlencoded = "0.7"
slotmap = "1.0.6"
smol_str = "0.3.6"
thiserror = "2.0.12"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }


# =============================================================================
# N-API / native addon compatibility
# =============================================================================

napi = { version = "2", features = ["napi4"] }
napi-build = "2"
napi-derive = "2"


# =============================================================================
# Native platform / OS integration
# =============================================================================

accesskit = "0.24.0"
accesskit_macos = "0.26.0"
accesskit_unix = "0.21.0"
accesskit_windows = "0.32.1"
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "notification",
    "open_uri",
    "file_chooser",
    "settings",
    "trash",
] }
backtrace = "0.3"
cc = "1"
# RealtimeKit client for the Linux audio thread (see SphereDirectAudioEngine).
# Already in the tree via ashpd; `async-io` matches ashpd so the two share one
# zbus build instead of dragging in a second reactor.
zbus = { version = "5", default-features = false, features = [
    "blocking-api",
    "async-io",
] }
ctor = "1.0.6"
dirs = "5"
dunce = "1.0"
embed-resource = "3.0"
env_logger = "0.11"
globset = "0.4"
hdrhistogram = "7"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
nix = "0.29"
parking_lot = "0.12"
pkg-config = "0.3"
pollster = "0.4"
profiling = "1"
raw-window-handle = { version = "0.6" }
rfd = "0.15"
rustc-hash = "2.1.0"
tempfile = "3.20.0"
tracing = "0.1.40"
walkdir = "2.5"
which = "6.0.0"


# =============================================================================
# Graphics / GPU / images
# =============================================================================

core-video = { version = "0.5.2", features = ["metal"] }
image = "0.25.1"
rust-embed = { version = "8.11", features = ["include-exclude"] }
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal", "gles"] }


# =============================================================================
# macOS platform
# =============================================================================

cocoa = "=0.26.0"
cocoa-foundation = "=0.2.0"
core-foundation = "=0.10.0"
core-foundation-sys = "0.8.6"
mach2 = "0.5"
metal = "0.33"
objc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics"] }
objc2-foundation = "0.3"


# =============================================================================
# Windows platform
# =============================================================================

windows = { version = "0.61", features = [
    "Foundation_Numerics",
    "Globalization_DateTimeFormatting",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_ViewManagement",
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",

    "Win32_Foundation",
    "Win32_Globalization",

    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",

    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Hlsl",
    "Win32_Graphics_Imaging",

    "Win32_Media",
    "Win32_Media_Audio",

    "Win32_Networking_WinSock",

    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",

    "Win32_Storage_FileSystem",

    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",

    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = "0.61"
x11-dl = "2"
windows-core = "0.61"
# Safe registry reader — used to derive the Professional Edition machine
# fingerprint from HKLM MachineGuid without a hand-rolled unsafe RegGetValueW.
windows-registry = "0.5"


# =============================================================================
# Web / WASM
# =============================================================================

console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2.120"
wasm-bindgen-test = "0.3"
web-time = "1.1.0"


# =============================================================================
# Networking / cloud / collaboration
# =============================================================================

bytes = "1.0"
http = "1.1"
http-body = "1.0"
percent-encoding = "2.3.2"
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }
# `aws-lc-rs` is rustls' own default backend and is named explicitly because
# reqwest/hyper-rustls also pull rustls' `ring` backend into the same build.
# With both compiled in rustls refuses to pick one, so the jam client installs
# this provider process-wide (see `SphereJamClient/src/crypto.rs`) and needs the
# feature to stay on.
rustls = { version = "0.23.26", features = ["aws-lc-rs"] }
# Platform trust store for the Jam media plane's TLS fallback transport.
# Already in the graph through reqwest/tungstenite; declared here because the
# jam client opens its own raw TLS socket rather than an HTTP one.
rustls-native-certs = "0.8"
rustls-pki-types = "1"
# Blocking WebSocket client for the Jam signaling plane. Sync on purpose: the
# jam worker owns a dedicated thread, so the studio gains no async runtime.
tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "rustls-tls-native-roots",
] }
rustls-platform-verifier = "0.5.0"
url = "2.2"


# =============================================================================
# Utilities
# =============================================================================

derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
# Offline license-token verification for the Professional Edition. Verification
# only — the signing key never ships in a build.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
heck = "0.5"
inventory = "0.3.19"
itertools = "0.14.0"
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
proc-macro2 = "1.0.93"
quote = "1.0.9"
rand = "0.9"
rayon = "1.8"
regex = "1.5"
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
sha2 = "0.10"
shlex = "1.3.0"
smallvec = { version = "1.6", features = ["union", "const_new"] }
stacksafe = "0.1"
strum = { version = "0.27.2", features = ["derive"] }
syn = { version = "2.0.101", features = ["full", "extra-traits", "visit-mut"] }
take-until = "0.2.0"
unicase = "2.6"
unicode-segmentation = "1.10"


# =============================================================================
# Database / plugin registry
# =============================================================================

rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
clap = { version = "4.5", features = ["derive"] }
lzma-rs = "0.3"
pbkdf2 = "0.12"
tar = "0.4"
toml = "0.8"


# =============================================================================
# Tests / benchmarks
# =============================================================================

criterion = { version = "0.5", features = ["html_reports"] }
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }


# =============================================================================
# Workspace lints
# =============================================================================

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }
non_snake_case = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"

style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"


# =============================================================================
# Patches
# =============================================================================

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }
cpal = { path = "external/cpal" }
rustysynth = { path = "external/rustysynth" }


# =============================================================================
# Profiles
# =============================================================================

# Realtime DSP must run optimized even in dev builds: NAM neural inference
# (nam-rs WaveNet/LSTM) and the 4×/8× oversampled amp core cannot hit realtime
# at opt-level 0 — debug builds audibly stutter without these overrides.
[profile.dev.package.nam-rs]
opt-level = 3

[profile.dev.package.rodharerist]
opt-level = 3

[profile.dev.package.builtin_dsp_core]
opt-level = 3

[profile.dev.package.biquad]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.futureboard-core]
opt-level = "s"
strip = "debuginfo"
