[package]
name = "sphere-video-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sphere_video_player"
path = "src/lib.rs"

# Video preview/reference decoding for the arrangement Video Track, on MKFF
# (crates/mkff) — Futureboard's own media framework. No FFmpeg / libav and no
# OS media framework (Media Foundation / AVFoundation) is used for decoding:
#
#   GPU      — MP4 / MOV with H.264 or HEVC: samples from MKFF's MP4 demuxer
#              go to an mkff-mediakit accelerant decoder (D3D11 / DXVA on
#              Windows, one accelerant per GPU). Machines or files the GPU
#              path cannot take fall through to software.
#   Software — every container / codec mkff-codecs decodes (MP4 / MOV, MKV /
#              WebM, AVI, MXF, MPEG-TS / PS, Y4M; H.264, HEVC, VP8, VP9, AV1,
#              MPEG-1/2, ProRes, DNxHD/HR, APV, MJPEG), in pure Rust, on every
#              platform including Linux.
#
# Diagnostics go to stderr with a `[video-mkff]` tag (the workspace installs no
# tracing subscriber), matching `[video-player]` in the UI crate.
[dependencies]
mkff-codecs = { path = "../mkff/bindings/rust/mkff-codecs" }
mkff-mediakit = { path = "../mkff/bindings/rust/mkff-mediakit" }
rayon.workspace = true
