[package]
name = "sphere-plugin-host"
version = "2026.10.16-beta1.4.4"
edition = "2021"
description = "SpherePluginHost — plugin scanning, the out-of-process host and native editor shell for Futureboard Studio"
license.workspace = true

[lib]
name = "SpherePluginHost"

[[bin]]
name = "FutureboardPluginScanner"
path = "src/bin/futureboard_plugin_scanner.rs"
required-features = ["plugin-scanner-bin"]

# Separated plugin/editor host process. Workspace builds skip it unless the
# feature is enabled, mirroring the scanner bin.
[[bin]]
name = "FutureboardPluginHostX64"
path = "src/bin/futureboard_plugin_host.rs"
required-features = ["plugin-host-bin"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
dirs.workspace = true
rusqlite.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
cpal.workspace = true
sphere_directaudioengine = { path = "../SphereDirectAudioEngine", default-features = false }
builtin-dsp-core.workspace = true
equz8.workspace = true
equzx.workspace = true
rodharerist.workspace = true
verbspace.workspace = true
whitesharp.workspace = true
echospace.workspace = true
imager.workspace = true
fa2a.workspace = true
fa76.workspace = true
burnlimit.workspace = true
clipper67.workspace = true
transient.workspace = true
waygate.workspace = true
wrapsynth.workspace = true
drumsampler.workspace = true
quicksampler.workspace = true
slicer.workspace = true
zcomp.workspace = true
mixstation.workspace = true
compresser.workspace = true
# Analyser FFT for the bridged-insert spectrum (src/spectrum.rs). Already a
# workspace dependency via rodharerist / SphereAudioProcessor — no new tree.
rustfft.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Win32 (COM STA, message pump, HWND validation, self-test windows) for the
# host binary. The main app already pulls the same workspace `windows` version
# transitively, so this adds no new toolchain surface.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell"] }
# The C runtime's descriptor table, to move a plug-in's `printf` off the
# protocol pipe (`plugin_host_lifecycle::take_protocol_stdout`).
libc.workspace = true

[build-dependencies]
cc.workspace = true
embed-resource.workspace = true

[features]
# Default build is native/rlib-safe for Studio workspace builds.
default = [
    "plugin-host-bin",
    "plugin-scanner-bin"
]

# Opt-in standalone scanner target.
plugin-scanner-bin = []

# Opt-in standalone plugin/editor host process target.
plugin-host-bin = []
