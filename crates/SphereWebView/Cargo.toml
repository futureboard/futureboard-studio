[package]
name = "SphereWebView"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CEF off-screen web views for Futureboard Studio"

[lib]
name = "sphere_webview"

[[example]]
name = "install_cef"
required-features = ["installer"]

[[example]]
name = "cef_gpui_macos_probe"
required-features = ["cef-runtime"]

[dependencies]
cef = { workspace = true, optional = true }
download-cef = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
log.workspace = true
tempfile = { workspace = true, optional = true }
url = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true, features = ["NSGeometry"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3.1"
gpui.workspace = true
gpui_macos.workspace = true

[features]
default = []
# Links the cef-rs bindings. Install the SDK first with the installer example.
cef-runtime = ["dep:cef", "dep:windows-sys", "dep:x11-dl", "dep:objc2", "dep:objc2-foundation", "dep:tempfile", "dep:url"]
# Enables the explicit, user-invoked CEF downloader/extractor.
installer = ["dep:download-cef", "dep:ureq"]

[lints]
workspace = true
