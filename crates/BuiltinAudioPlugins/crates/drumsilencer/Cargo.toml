[package]
name = "drumsilencer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Drum Silencer — low-latency drum removal DSP core"
# The training scripts and runs are not part of the crate.
exclude = ["training/"]

[lib]
name = "drumsilencer"
# `rlib` for the umbrella crate / tests; `cdylib` so it also compiles as a
# Built-in Plugin dynamic library, like every other built-in.
crate-type = ["rlib", "cdylib"]

[dependencies]
builtin-dsp-core.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
