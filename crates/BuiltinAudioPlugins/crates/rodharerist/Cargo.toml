[package]
name = "rodharerist"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rodhareist — flagship guitar multi-effect DSP core"

[lib]
name = "rodharerist"
# `rlib` for workspace unit tests; `cdylib` for the eventual Built-in Plugin
# dynamic library (C entry points + embedded editor UI are a later slice).
crate-type = ["rlib", "cdylib"]

[dependencies]
biquad.workspace = true
builtin-dsp-core.workspace = true
nam-rs.workspace = true
# Partitioned FFT convolution for the cabinet IR engine (see src/dsp/ir.rs).
# Already a workspace dependency (SphereAudioProcessor) — no new tree.
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
