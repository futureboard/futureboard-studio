[package]
name = "duckstep"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Duckstep — sidechain ducker and tempo-synced volume shaper DSP core"

[lib]
name = "duckstep"
# `rlib` for the workspace/host crates; `cdylib` so it also compiles as a
# Built-in Plugin dynamic library (C entry points are a later slice).
crate-type = ["rlib", "cdylib"]

[dependencies]
biquad.workspace = true
builtin-dsp-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
