[package]
name = "sphere_voxtune"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Solfege Voxtune vocal engine: YIN analysis, note segmentation, TD-PSOLA pitch/formant rendering and note editing, shared by the Android app, Studio's tuner panel, the desktop app and the VST3/ARA plug-in"

# Versions are spelled out rather than inherited from the root workspace: the
# Android crate (`apps/mobile/solfege_voxtune/rust`) builds this as a path
# dependency from its own workspace.
[dependencies]
biquad = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
symphonia = { version = "0.5", default-features = false, features = [
    "wav",
    "pcm",
    "aiff",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "isomp4",
    "aac",
    "alac",
] }