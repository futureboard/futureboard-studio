[workspace]
resolver = "2"
members = [".", "xtask"]

[package]
name = "whitesharp_vst3"
version = "0.1.0"
# The editor is the DAW's own WhiteSharp UI, compiled in from its source tree
# (`src/components`); those files are written against edition 2021.
edition = "2021"
license = "MIT"
publish = false
description = "WhiteSharp realtime pitch correction as a VST3 and CLAP plug-in"

[lib]
# `lib` too, so tests can link the plug-in.
crate-type = ["cdylib", "lib"]

[features]
default = ["gpu-renderer"]
# Same name as the DAW's feature: the shared editor files gate the wgpu stage
# on it.
gpu-renderer = [
    "dep:wgpu",
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:windows-d3d12",
]
# Named only so the shared editor files' `cfg`s are known; nothing enables
# them here.
ui-preview = []
builtin-plugin-editor = []

[dependencies]
nih_plug = { git = "https://github.com/arizkami/nihplug_gpui", features = ["assert_process_allocs"] }
nih_plug_gpui = { git = "https://github.com/arizkami/nihplug_gpui" }
# The DSP core, unchanged from the DAW, and the effect trait it implements.
whitesharp = { path = "../../crates/BuiltinAudioPlugins/crates/whitesharp" }
builtin_dsp_core = { path = "../../crates/BuiltinAudioPlugins/crates/builtin_dsp_core" }

# The shared editor files name `gpui` directly. Patched below to the DAW's
# GPUI, so these and `nih_plug_gpui` are the same crate.
gpui = { git = "https://github.com/futureboard/gpui-se.git", default-features = false }

# What the shared editor files use. `fx_model` names the VerbSpace and
# EchoSpace DSP crates for their knob ranges.
echospace = { path = "../../crates/BuiltinAudioPlugins/crates/echospace" }
verbspace = { path = "../../crates/BuiltinAudioPlugins/crates/verbspace" }
ebur128 = "0.1"
image = "0.25.1"
rustfft = "6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smallvec = { version = "1.6", features = ["union", "const_new"] }
dirs = "5"

pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal", "gles"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
] }
# wgpu-hal hands its D3D12 device out as `windows` 0.62 types; the stage's
# shared texture is created with the same version (as in the DAW).
windows-d3d12 = { package = "windows", version = "0.62", optional = true, default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[patch."https://github.com/futureboard/gpui-se.git"]
# The DAW's GPUI carries the patches the stage needs (D3D11 external images
# for the wgpu shared texture).
gpui = { path = "../../crates/gpui" }
gpui_linux = { path = "../../crates/gpui/crates/gpui_linux" }
gpui_windows = { path = "../../crates/gpui/crates/gpui_windows" }

[patch."https://github.com/arizkami/nihplug_gpui"]
# Vendored into this repo so a build does not depend on a checkout outside it.
nih_plug = { path = "../../external/nihplug_gpui" }
nih_plug_gpui = { path = "../../external/nihplug_gpui/nih_plug_gpui" }
nih_plug_xtask = { path = "../../external/nihplug_gpui/nih_plug_xtask" }

[patch.crates-io]
# As in the DAW: GPUI is built against these.
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

[profile.dev.package.whitesharp]
opt-level = 3

[profile.dev.package.builtin_dsp_core]
opt-level = 3

[profile.dev.package.biquad]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
