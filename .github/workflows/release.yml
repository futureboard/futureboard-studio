name: Release Build

# Builds the Windows installer, macOS DMG and Linux AppImage, then attaches
# them to an existing GitHub release without touching its release notes.
#
# This is the only workflow that publishes a versioned release. It uploads
# assets onto a prepared (usually draft) release and leaves the body alone, so
# a curated changelog survives the build; `visibility` decides whether it then
# goes public. Pushing a tag publishes nothing (#341): `build-desktop.yml` has
# no tag trigger. The AUR checksum is updated here too (#360), since this is
# the only place the released AppImage exists.
#
# Dispatch only, on purpose. This used to carry a `schedule:` that started the
# build 90 minutes ahead of a planned release moment, with a date guard making
# it a one-shot and `publish-scheduled-release.yml` flipping the finished draft
# to public. That companion workflow is gone, so a scheduled run could only ever
# stage a draft nobody published — and on 2026-08-09 the cron and a manual
# dispatch of the same release collided into two full builds of one hotfix.
# Release moments are decided by hand; the trigger is too.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to (e.g. 2026.9.4-beta1.2).
        type: string
        required: true
        # Kept in step with `version.json` by `scripts/sync-version.mjs`. A
        # stale default here is worse than none: the dispatch form is prefilled
        # with it, so a hurried release attaches a freshly built installer to
        # whatever tag was current months ago.
        default: "2026.11.1-beta2.0.0"
      app-version:
        description: Version to build. Empty uses version.json.
        type: string
        required: false
        default: ""
      visibility:
        description: Leave the release as a draft, or publish it when the upload succeeds.
        type: choice
        required: true
        default: draft
        options:
          - draft
          - publish
      prerelease:
        description: Mark the release as a pre-release.
        type: boolean
        required: false
        default: true
      latest:
        description: Set this release as "Latest" when publishing.
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

# Read-only by default; the two jobs below that publish ask for write.
permissions:
  contents: read

jobs:
  build:
    name: Build Native
    uses: ./.github/workflows/build-desktop.yml
    # A called workflow can never hold more than its caller grants. Its jobs
    # only build, so read is all they get.
    permissions:
      contents: read
    with:
      app-version: ${{ inputs.app-version }}
      # A release is what installed builds update to, and what new users
      # install; one built without the update key could never update (#339).
      require-update-key: true
    secrets:
      FUTUREBOARD_UPDATE_PUBLIC_KEY: ${{ secrets.FUTUREBOARD_UPDATE_PUBLIC_KEY }}

  publish:
    name: Attach Release Assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      APP_VERSION: ${{ needs.build.outputs.app-version }}

    steps:
      # For the signing script only. Checked out before the download because
      # checkout cleans the workspace.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # #339: every installer needs `<asset>.sig`, an Ed25519 signature by the
      # key whose public half the build baked in (#268); the updater offers
      # nothing without one. The script checks the two secrets belong
      # together and verifies each signature before anything is uploaded.
      - name: Sign installers for the in-app updater
        env:
          FUTUREBOARD_UPDATE_SIGNING_KEY: ${{ secrets.FUTUREBOARD_UPDATE_SIGNING_KEY }}
          FUTUREBOARD_UPDATE_PUBLIC_KEY: ${{ secrets.FUTUREBOARD_UPDATE_PUBLIC_KEY }}
        run: bash .github/workflows/sign-update-assets.sh dist

      - name: List release assets
        run: ls -lh dist/

      # The in-app updater (`apps/native/studio/src/updater.rs::asset_rank`)
      # picks its download by filename: Windows needs `setup` + `.exe`, Linux
      # needs `x86_64` + `.appimage`, and macOS ranks `macos-<arch>` above
      # `macos-universal` and refuses the other architecture outright. A renamed
      # or missing bundle silently makes the release un-updatable for a whole
      # platform, so fail here instead. Each one also needs its `<asset>.sig`
      # (#339): without it the updater skips the release entirely.
      - name: Verify updater can resolve every platform asset
        run: |
          set -euo pipefail
          shopt -s nullglob nocaseglob
          fail=0
          check() {
            local label="$1" pattern="$2"
            local -a matches=(dist/$pattern)
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::no $label asset matching '$pattern'"
              fail=1
            elif [ ${#matches[@]} -gt 1 ]; then
              # More than one match means a bundle from an earlier build rode
              # along, and the updater would pick between them by name order.
              # 2026.8.9-beta1 shipped a 2026.8.8-beta1 AppImage exactly here,
              # and this step passed because it only asked for one match.
              echo "::error::$label matched ${#matches[@]} assets: ${matches[*]}"
              fail=1
            elif [[ "${matches[0]}" != *"$APP_VERSION"* ]]; then
              echo "::error::$label asset ${matches[0]} is not version $APP_VERSION"
              fail=1
            elif [ ! -s "${matches[0]}.sig" ]; then
              echo "::error::$label asset ${matches[0]} has no signature ${matches[0]}.sig"
              fail=1
            else
              echo "$label: ${matches[0]} (+ .sig)"
            fi
          }
          check "windows"         "*setup*.exe"
          check "macos-universal" "*macos-universal*.dmg"
          check "macos-arm64"     "*macos-arm64*.dmg"
          check "macos-x86_64"    "*macos-x86_64*.dmg"
          check "linux"           "*x86_64*.AppImage"
          exit $fail

      # An updater resolves a release's version from its tag. A moving tag such
      # as `beta` carries none, so every build up to and including
      # 2026.8.9-beta1 — which read the tag and nothing else — skips the release
      # outright and never offers the update. Later builds fall back to the
      # asset filenames, but installs already in the field do not, and cannot be
      # taught to. Reaching them means publishing at a version tag.
      - name: Check the tag is one installed updaters can resolve
        run: |
          set -euo pipefail
          if [[ "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "$TAG is a version tag — every updater can resolve it."
          else
            echo "::warning::'$TAG' is a moving tag. Installs of 2026.8.9-beta1 and earlier will not see this release. Publish at a version tag such as '$APP_VERSION' to reach them."
          fi

      - name: Attach assets to the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Uploading onto existing release $TAG (notes left untouched)."
            gh release upload "$TAG" dist/* --clobber
          else
            echo "No release tagged $TAG yet — creating it as a draft."
            gh release create "$TAG" dist/* \
              --draft \
              --title "Futureboard Studio $APP_VERSION" \
              --notes "Automated release build for \`$APP_VERSION\`. Release notes pending."
          fi

      # `draft` only means "do not flip the draft bit here". Uploading onto a tag
      # that already points at a *published* release — the moving `beta` tag —
      # puts the assets in front of users the moment they land, whatever this
      # input says. The report step below states what is actually true.
      - name: Publish the release
        if: inputs.visibility == 'publish'
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --draft=false \
            --prerelease=${{ inputs.prerelease }} \
            --latest=${{ inputs.latest }}
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,publishedAt

      - name: Report draft state
        if: inputs.visibility != 'publish'
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "Assets attached. Release $TAG stays a draft until it is published."
          else
            echo "::warning::$TAG was already published — the uploaded assets are live now."
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease

  # The AUR package (packaging/aur) downloads the AppImage from the release at
  # `_appver` and verifies it against `sha256sums_x86_64`. This was written
  # only by build-desktop's tag-push publish job, which never ran for Release
  # Build releases and is gone now (#341), so the committed checksum stayed all
  # zeros and the package could not build (#360). It is written here, from the
  # exact AppImage `publish` just attached, whether the release stays a draft
  # or not: a draft published later in the UI is the same file, and a re-run
  # for the same tag (assets uploaded with --clobber) rewrites the checksum.
  aur-checksum:
    name: Update AUR PKGBUILD
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.build.outputs.app-version }}
      BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      # The bump lands on the default branch, whatever ref this run was
      # dispatched from (a tag ref is a detached HEAD `git push` cannot use).
      - name: Checkout default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the Linux bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: futureboard-native-linux-bundle
          path: dist

      # sync-version.mjs owns the AUR fields: `pkgver` with `-` mapped to `_`
      # (AUR forbids `-`) and `_appver` with the exact asset version. It also
      # rewrites other version-carrying files; only the AUR pair is committed.
      - name: Update AUR PKGBUILD version and checksum
        run: |
          set -euo pipefail
          # The PKGBUILD downloads releases/download/<_appver>/. A `v`-prefixed
          # (or otherwise different) tag would leave the AUR package pointing at
          # a tag that does not exist, so do not bump it from such a release.
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::warning::Tag ${TAG} is not the bare version ${VERSION}; AUR PKGBUILD not updated."
            exit 0
          fi
          node scripts/sync-version.mjs --version "${VERSION}"
          python3 - <<'PY'
          import hashlib, os, pathlib, re, sys
          version = os.environ["VERSION"]
          expected = f"Futureboard.Studio-{version}-x86_64.AppImage"
          matches = sorted(pathlib.Path("dist").glob("*x86_64*.AppImage"))
          if [m.name for m in matches] != [expected]:
              sys.exit(f"expected exactly {expected} in dist/, found {[m.name for m in matches]}")
          digest = hashlib.sha256(matches[0].read_bytes()).hexdigest()
          pkgbuild = pathlib.Path("packaging/aur/PKGBUILD")
          srcinfo = pathlib.Path("packaging/aur/.SRCINFO")
          pkg_text = pkgbuild.read_text(encoding="utf-8")
          pkg_next, pkg_count = re.subn(
              r"^sha256sums_x86_64=\('.*'\)$",
              f"sha256sums_x86_64=('{digest}')",
              pkg_text,
              count=1,
              flags=re.M,
          )
          if pkg_count != 1:
              sys.exit("PKGBUILD is missing sha256sums_x86_64")
          pkgbuild.write_text(pkg_next, encoding="utf-8")
          info_text = srcinfo.read_text(encoding="utf-8")
          info_next, info_count = re.subn(
              "^[ \t]*sha256sums_x86_64 = .*$",
              f"\tsha256sums_x86_64 = {digest}",
              info_text,
              count=1,
              flags=re.M,
          )
          if info_count != 1:
              sys.exit(".SRCINFO is missing sha256sums_x86_64")
          srcinfo.write_text(info_next, encoding="utf-8")
          print(f"AUR sha256 {digest} ({matches[0].name})")
          PY
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "AUR files already at ${VERSION} with this checksum; nothing to push."
            exit 0
          fi
          git commit -m "chore: update AUR package to ${VERSION} [skip ci]"
          git push origin "HEAD:refs/heads/${BRANCH}"
