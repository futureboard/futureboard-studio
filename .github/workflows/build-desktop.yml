name: Build Desktop

on:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - "v*"
  workflow_dispatch:
  # Called by `release.yml` so the release build uses these exact steps instead
  # of a third copy of them. The `release` job below stays skipped for callers
  # because `github.ref` is then the caller's branch, not a tag.
  workflow_call:
    secrets:
      APAK_VERIFYING_KEY:
        description: Public Ed25519 key baked into APAK installers.
        required: true
    inputs:
      app-version:
        description: Version to build instead of the one in version.json.
        type: string
        required: false
        default: ""
    outputs:
      app-version:
        description: Version the artifacts were built with.
        value: ${{ jobs.version.outputs.app-version }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Read Version
    runs-on: ubuntu-24.04
    outputs:
      app-version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: read
        env:
          VERSION_OVERRIDE: ${{ inputs.app-version }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION_OVERRIDE}" ]; then
            VERSION="${VERSION_OVERRIDE}"
          else
            VERSION=$(node -p "require('./version.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

  build:
    name: Build Native (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      APAK_VERIFYING_KEY: ${{ secrets.APAK_VERIFYING_KEY }}
      # The account-service base is baked in at compile time
      # (crates/SphereUIComponents/build.rs). CI has no .env, so without
      # this every built Studio reports "sign-in is not configured". It is
      # a public origin, not a secret; a repository variable can override it.
      FUTUREBOARD_AUTH_API_URL: ${{ vars.FUTUREBOARD_AUTH_API_URL || 'https://futureboard.studio' }}
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            native-artifact-name: futureboard-native-linux
            native-bundle-glob: target/appimage/*.AppImage
          - os: macos-latest
            platform: mac
            native-artifact-name: futureboard-native-macos
            native-bundle-glob: packaging/native/out/*.dmg
          - os: windows-latest
            platform: win
            native-artifact-name: futureboard-native-win
            native-bundle-glob: target/installer/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize submodules (audio SDKs + shared icons)
        shell: bash
        run: bash .github/workflows/submodules-init.sh

      - name: Sync release version
        run: |
          node scripts/sync-version.mjs --version "${{ needs.version.outputs.app-version }}"
          node scripts/sync-version.mjs --version "${{ needs.version.outputs.app-version }}" --check

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential pkg-config libarchive-tools fakeroot rpm \
            libopenjp2-tools libasound2-dev \
            libgtk-4-dev libglib2.0-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-render-util0-dev libxcb-composite0-dev \
            libxi-dev libgl1-mesa-dev libfontconfig1-dev \
            libssl-dev

      - name: Configure macOS libclang (bindgen)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          # bindgen parses headers with the libclang at LIBCLANG_PATH, but
          # detects the system include paths by running the `clang` in PATH —
          # Xcode's. A Homebrew LLVM of a different version then parses Xcode's
          # intrinsics headers, which explodes on `__m128` as soon as the target
          # is x86_64 (the Intel half of the universal build). Take libclang
          # from the toolchain that owns those headers.
          LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$LIBCLANG_PATH/libclang.dylib"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "libclang: $LIBCLANG_PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # macOS ships as one universal app. The runner is arm64, so the Intel
      # slice is cross-compiled and both toolchain targets must be present.
      - name: Add macOS universal Rust targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Rust dependencies and CEF
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            build/cef
          key: desktop-v2-cargo-cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            desktop-v2-cargo-cef-${{ runner.os }}-

      - name: Configure versioned CEF path
        shell: bash
        run: bash .github/workflows/set-cef-path.sh

      - name: Install pinned CEF SDK and runtime
        if: matrix.os != 'macos-latest' && hashFiles('build/cef/150.0.11/**/archive.json') == ''
        run: cargo run -p SphereWebView --example install_cef --features installer

      # CEF publishes macosx64 and macosarm64 as separate distributions — there
      # is no universal one — so a universal app needs both staged here. The
      # installer keeps an already-valid distribution, so the cache still wins.
      - name: Install pinned CEF SDKs (macOS x86_64 + arm64)
        if: matrix.os == 'macos-latest'
        run: cargo run -p SphereWebView --example install_cef --features installer -- --target universal-macos

      - name: Verify shared app assets
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            packages/shared/app/icons/app.png \
            packages/shared/app/icons/icon.ico \
            packages/shared/app/icons/icon.icns \
            packages/shared/app/windows/app.rc \
            packages/shared/app/windows/app.manifest; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "Shared app assets OK"

      - name: Package native runtime with xtask
        if: matrix.os != 'macos-latest'
        run: cargo run -p xtask -- package --profile release --edition community --plugin all

      # One package per architecture, then a lipo merge. xtask passes the
      # target-matched CEF distribution to Cargo itself, so no per-pass CEF_PATH
      # is needed here.
      - name: Package native runtime with xtask (macOS universal)
        if: matrix.os == 'macos-latest'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          for triple in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo run -p xtask -- package --profile release --edition community \
              --plugin all --target "$triple"
          done
          bash packaging/native/merge-universal-macos.sh \
            out/release/community/macos-x64 \
            out/release/community/macos-arm64 \
            out/release/community/macos-universal

      - name: Resolve xtask package directory
        shell: bash
        run: |
          set -euo pipefail
          if [ -d out/release/community/macos-universal ]; then
            package_dir="out/release/community/macos-universal"
          else
            package_dir="$(find out/release/community -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi
          test -n "$package_dir" || { echo "xtask package directory not found"; exit 1; }
          test -f "$package_dir/build-info.json" || { echo "missing $package_dir/build-info.json"; exit 1; }
          echo "FUTUREBOARD_PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "xtask package: $package_dir"

      # Three images per release: macos-arm64, macos-x86_64, and macos-universal.
      # Per-arch packages are already staged by the xtask passes above; the
      # universal tree is their lipo merge. Bundling costs no extra compile.
      # Ship the single-architecture DMGs first so a universal-only codesign
      # regression cannot block Apple Silicon / Intel images. bundle-macos-dmg.sh
      # names each image after the architectures it actually contains.
      - name: Bundle native apps (macOS arm64 + x64 + universal)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.app-version }}"
          bundle() {
            local package_dir="$1" variant="$2" require_universal="$3"
            local app_out="packaging/native/out/$variant"
            local app="$app_out/Futureboard Studio.app"
            FUTUREBOARD_REQUIRE_UNIVERSAL="$require_universal" bash packaging/native/bundle-macos.sh "$package_dir" "$app_out" "$VERSION"
            bash packaging/native/bundle-macos-dmg.sh "$app" packaging/native/out "$VERSION"
          }
          bundle out/release/community/macos-arm64     arm64     0
          bundle out/release/community/macos-x64       x64       0
          bundle out/release/community/macos-universal universal 1
          for expected in macos-arm64 macos-x86_64 macos-universal; do
            ls packaging/native/out/*-${expected}.dmg >/dev/null \
              || { echo "error: missing ${expected} DMG"; exit 1; }
          done
          ls -lh packaging/native/out/*.dmg

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # `target` is restored from the build cache, so installers from an
          # earlier run survive here. They break the rename below and would be
          # picked up by the `target/installer/*.exe` upload glob.
          if (Test-Path target/installer) { Remove-Item -Recurse -Force target/installer }
          ./packaging/windows/build-installer.ps1 -AppVersion "${{ needs.version.outputs.app-version }}" -SourceDir $env:FUTUREBOARD_PACKAGE_DIR
          Move-Item target/installer/FutureboardStudioSetup.exe "target/installer/Futureboard.Studio-${{ needs.version.outputs.app-version }}-windows-x86_64-Setup.exe"

      # Bare `version.json` version (no nightly suffix here — this workflow
      # only runs on tagged releases), matching the AUR PKGBUILD's `pkgver`
      # so its hardcoded AppImage filename resolves against this release.
      - name: Build AppImage (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          # Same hazard as the Windows installer above, and the reason the
          # 2026.8.9-beta1 release shipped a stale 2026.8.8-beta1 AppImage
          # beside it: `target` is restored from the build cache, the image is
          # named after the version, so last release's file survives under a
          # name this run never overwrites and the `target/appimage/*.AppImage`
          # upload glob sweeps it into the release.
          rm -rf "$PWD/target/appimage"
          bash packaging/linux/bundle-appimage.sh "$FUTUREBOARD_PACKAGE_DIR" "$PWD/target/appimage" "${{ needs.version.outputs.app-version }}"

      - name: Archive xtask runtime package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-native-archives
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            pwsh -NoProfile -Command 'Compress-Archive -Path (Join-Path $env:FUTUREBOARD_PACKAGE_DIR "*") -DestinationPath "dist-native-archives/${{ matrix.native-artifact-name }}-runtime.zip" -Force'
          else
            tar -czf "dist-native-archives/${{ matrix.native-artifact-name }}-runtime.tar.gz" -C "$FUTUREBOARD_PACKAGE_DIR" .
          fi
          ls -lh dist-native-archives/

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.native-artifact-name }}-runtime
          path: dist-native-archives/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload native bundle artifact
        if: matrix.native-bundle-glob != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.native-artifact-name }}-bundle
          path: ${{ matrix.native-bundle-glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Futureboard Studio v${{ needs.version.outputs.app-version }}"
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update AUR PKGBUILD version
        run: |
          VERSION="${{ needs.version.outputs.app-version }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgver = .*/pkgver = ${VERSION}/" packaging/aur/.SRCINFO
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          git diff --cached --quiet || git commit -m "chore: bump AUR pkgver to ${VERSION} [skip ci]"
          git push
