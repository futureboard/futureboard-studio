name: CI

# Quality gates for the maintained desktop surface (Rust/GPUI native + audio
# engine + plugin host), built as the Community Edition via the *-ce cargo
# aliases in .cargo/config.toml (target/community). Build/packaging of release
# artifacts lives in build-desktop.yml / daily-build.yml — this workflow only
# checks correctness, on all three desktop targets (Windows / macOS / Linux).

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checks only: nothing here writes to the repository or its releases.
permissions:
  contents: read

jobs:
  version-format:
    name: Version scheme
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      # Futureboard uses calendar versioning: YYYY.M.D, no zero padding on
      # month or day, with an optional pre-release suffix (-beta1, -nightly).
      # `version.json` is the single source; sync-version.mjs pushes it into
      # apps/native/studio/Cargo.toml. A malformed version otherwise only
      # surfaces after an hour-long release build, so check it up front.
      - name: Validate version.json and Cargo sync
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./version.json').version")"
          echo "version.json: $VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]{4}\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not YYYY.M.D[-prerelease] (no zero padding, e.g. 2026.8.8-beta1)"
            exit 1
          fi

          MONTH="${BASH_REMATCH[1]}"
          DAY="${BASH_REMATCH[2]}"
          if [ "$MONTH" -lt 1 ] || [ "$MONTH" -gt 12 ]; then
            echo "::error::month '$MONTH' in '$VERSION' is out of range"
            exit 1
          fi
          if [ "$DAY" -lt 1 ] || [ "$DAY" -gt 31 ]; then
            echo "::error::day '$DAY' in '$VERSION' is out of range"
            exit 1
          fi

          node scripts/sync-version.mjs --check

  packaging-scripts:
    name: Packaging scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      # These scripts only ever run on a release runner, where a syntax error
      # costs a full build before it surfaces.
      - name: Shell syntax
        run: |
          set -euo pipefail
          for script in .github/workflows/*.sh packaging/native/*.sh packaging/linux/*.sh; do
            bash -n "$script"
            echo "ok: $script"
          done

      # The CEF version pinned in the CI helper must track the Rust constant, or
      # the workflow installs one distribution and the build looks for another.
      - name: CEF version pin matches SphereWebView
        run: |
          set -euo pipefail
          rust_version="$(sed -n 's/.*CEF_SHORT_VERSION: &str = "\([^"]*\)".*/\1/p' crates/SphereWebView/src/lib.rs)"
          script_version="$(sed -n 's/^cef_version="\([^"]*\)".*/\1/p' .github/workflows/set-cef-path.sh)"
          echo "lib.rs: $rust_version, set-cef-path.sh: $script_version"
          test -n "$rust_version" && test "$rust_version" = "$script_version"

          # The build workflows probe the same versioned directory to decide
          # whether the cache already holds a distribution.
          for workflow in .github/workflows/build-desktop.yml .github/workflows/daily-build.yml .github/workflows/ci.yml; do
            grep -q "build/cef/${rust_version}/" "$workflow" || {
              echo "::error::$workflow does not reference build/cef/${rust_version}/"
              exit 1
            }
          done

  # Enforces deny.toml: RustSec advisories (vulnerable, unsound, unmaintained),
  # banned crates, licenses and allowed sources. Lockfile-only, so one Linux
  # runner covers every target (`targets = []` checks all of them).
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: "0.20.2"
      # SHA-256 of cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz, the
      # digest GitHub records for that release asset.
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      # `[patch.crates-io] cpal` points at this submodule; without it Cargo
      # cannot resolve the workspace at all. Nothing else is needed.
      - name: Initialize cpal submodule
        run: git submodule update --init --depth=1 --checkout -- external/cpal

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16

      - name: Install cargo-deny (pinned, checksum-verified)
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}"
          install -m755 "${RUNNER_TEMP}/${name}/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"
          cargo deny --version

      - name: cargo deny check (advisories, bans, sources)
        run: cargo deny --locked check advisories bans sources

      # Licenses are reported but not yet enforced: LGPL LAME (mp3lame-*,
      # #284) and CDLA-Permissive-2.0 webpki-roots still fail the policy and
      # need a product decision. Drop continue-on-error once #284 is settled.
      - name: cargo deny check licenses (report only, #284)
        continue-on-error: true
        run: cargo deny --locked check licenses

  rust-fmt:
    name: Rust format (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Format does not need submodule contents, but keep .gitmodules
          # available for path-aware tooling.
          fetch-depth: 1

      - name: Setup Rust (rustfmt)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  rust-clippy-test:
    name: Rust clippy + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # The account-service base is baked in at compile time
      # (crates/SphereUIComponents/build.rs). CI has no .env, so without
      # this every built Studio reports "sign-in is not configured". It is
      # a public origin, not a secret; a repository variable can override it.
      FUTUREBOARD_AUTH_API_URL: ${{ vars.FUTUREBOARD_AUTH_API_URL || 'https://futureboard.studio' }}
      # No TONE3000 partner key: nothing here needs it, and CI artifacts must
      # not carry it (see crates/SphereUIComponents/build.rs).
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          # Submodules are pulled explicitly below (shallow + selective) so we
          # do not pay for a full recursive clone of VST3 docs/history.
          submodules: false

      - name: Initialize submodules (audio SDKs + shared icons)
        shell: bash
        run: bash .github/workflows/submodules-init.sh

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential pkg-config libarchive-tools fakeroot rpm \
            libopenjp2-tools libasound2-dev \
            libgtk-4-dev libglib2.0-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-render-util0-dev libxcb-composite0-dev \
            libxi-dev libgl1-mesa-dev libfontconfig1-dev \
            libssl-dev

      # coreaudio-sys / bindgen need a discoverable libclang on macOS runners.
      - name: Configure macOS libclang (bindgen)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # bindgen parses headers with the libclang at LIBCLANG_PATH, but
          # detects the system include paths by running the `clang` in PATH —
          # Xcode's. A Homebrew LLVM of a different version then parses Xcode's
          # intrinsics headers, which explodes on `__m128` as soon as the target
          # is x86_64 (the Intel half of the universal build). Take libclang
          # from the toolchain that owns those headers.
          LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$LIBCLANG_PATH/libclang.dylib"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "libclang: $LIBCLANG_PATH"

      - name: Setup Rust (clippy)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache Rust dependencies and CEF
        id: ci-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            build/cef
          key: ci-v2-cargo-cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-v2-cargo-cef-${{ runner.os }}-

      - name: Configure versioned CEF path
        shell: bash
        run: bash .github/workflows/set-cef-path.sh

      # Always run so a restored CEF cache is re-checked against the pin.
      - name: Install pinned CEF SDK and runtime
        run: cargo run -p SphereWebView --example install_cef --features installer

      # crashpad-rs-sys downloads and links its prebuilt without a digest
      # check. xtask downloads the pinned archive, checks its SHA-256 and
      # extracts it into a private cache; CRASHPAD_CACHE_DIR makes the build
      # script use that instead (#288).
      - name: Verify pinned Crashpad prebuilt
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$(cargo run -q -p xtask -- crashpad-prebuilt --target-dir target/community)"
          echo "CRASHPAD_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: cargo clippy (Community Edition)
        run: cargo clippy-ce --all-targets -- -D warnings

      - name: cargo test (Community Edition)
        run: cargo test-ce

  # The macOS runner is arm64, so the Intel half of the universal build is
  # cross-compiled and never exercised by the job above. Without this gate an
  # x86_64-only break surfaces only during a release build.
  macos-intel-cross:
    name: macOS Intel slice (cross-compile)
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize submodules (audio SDKs + shared icons)
        shell: bash
        run: bash .github/workflows/submodules-init.sh

      - name: Configure macOS libclang (bindgen)
        run: |
          set -euo pipefail
          # bindgen parses headers with the libclang at LIBCLANG_PATH, but
          # detects the system include paths by running the `clang` in PATH —
          # Xcode's. A Homebrew LLVM of a different version then parses Xcode's
          # intrinsics headers, which explodes on `__m128` as soon as the target
          # is x86_64 (the Intel half of the universal build). Take libclang
          # from the toolchain that owns those headers.
          LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$LIBCLANG_PATH/libclang.dylib"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "libclang: $LIBCLANG_PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          targets: x86_64-apple-darwin

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache Rust dependencies and CEF
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            build/cef
          key: ci-macos-intel-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-macos-intel-v1-

      - name: Configure versioned CEF path (x86_64)
        shell: bash
        run: bash .github/workflows/set-cef-path.sh x86_64-apple-darwin

      - name: Install pinned CEF SDK (macOS x86_64)
        run: cargo run -p SphereWebView --example install_cef --features installer -- --target x86_64-apple-darwin

      - name: cargo check (x86_64-apple-darwin)
        run: |
          cargo check --target x86_64-apple-darwin \
            -p futureboard_native \
            -p sphere-plugin-host \
            -p futureboard_cef_helper \
            --features sphere-plugin-host/plugin-host-bin,sphere-plugin-host/plugin-scanner-bin

  # #344: the VST3/CLAP plug-ins under vstplugins/ are separate Cargo
  # workspaces that compile Studio's UI files directly (`#[path]` modules into
  # crates/SphereUIComponents) plus Studio's DSP crates and vendored GPUI /
  # nih-plug by path. Nothing above builds them, so a Studio change that breaks
  # one kept CI green (#285, and Rodhareist again after it). Each is checked
  # on its own lockfile, with its tests (`--all-targets`).
  #
  # Windows is where the plug-ins ship and is enforced. Linux and macOS are
  # supported by the editor bridge (nih_plug_gpui embeds into X11 and AppKit
  # hosts) but have never been built here, so they report without failing
  # the run until a first green run shows they compile; then drop
  # `continue-on-error`.
  vst3-plugins:
    name: VST3 ${{ matrix.plugin }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
        plugin: [rodhareist_vst3, voxtune_vst3, whitesharp_vst3]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      # The mounted Studio `assets.rs` embeds these icons with include_str!.
      # Everything else the plug-ins use (GPUI, nih-plug, DSP crates, the ARA
      # bindings) is in-tree.
      - name: Initialize icon submodules
        run: git submodule update --init --depth=1 --checkout -- packages/shared/lucide packages/shared/tabler-icons

      # The Studio list above, plus GTK 3 for rfd's default Linux dialog
      # backend (Rodhareist's NAM/IR pickers) and X11-xcb for host embedding.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential pkg-config libasound2-dev \
            libgtk-4-dev libgtk-3-dev libglib2.0-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-render-util0-dev libxcb-composite0-dev \
            libxi-dev libgl1-mesa-dev libfontconfig1-dev \
            libssl-dev

      - name: Configure macOS libclang (bindgen)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Same reasoning as rust-clippy-test: take libclang from the Xcode
          # toolchain that owns the system headers.
          LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$LIBCLANG_PATH/libclang.dylib"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vstplugins/${{ matrix.plugin }}/target
          key: vst3-v1-${{ matrix.plugin }}-${{ runner.os }}-${{ hashFiles(format('vstplugins/{0}/Cargo.lock', matrix.plugin)) }}
          restore-keys: |
            vst3-v1-${{ matrix.plugin }}-${{ runner.os }}-

      - name: cargo check (${{ matrix.plugin }})
        working-directory: vstplugins/${{ matrix.plugin }}
        run: cargo check --locked --all-targets
